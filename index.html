<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录系统</title>

<!-- 防F12 防右键 防查看源码 -->
<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if(e.key === 'F12') e.preventDefault();
    if(e.ctrlKey && e.key.toLowerCase() === 'u') e.preventDefault();
    if(e.ctrlKey && e.shiftKey && e.key === 'I') e.preventDefault();
    if(e.ctrlKey && e.shiftKey && e.key === 'J') e.preventDefault();
});
</script>

<style>
    .logo{position: absolute;
    width: 70px;
height: 70px;
top: 35%;
left: 34%;
border-radius: 50%;}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  width: 100vw;
  height: 100vh;
  background: url(bg1.jpg) no-repeat left;
  background-size: cover;
  display: flex;
  justify-content:center;
  align-items: center;
}
.login-box {
  background: rgba(0, 0, 0, 0.397);
  padding: 40px 30px;
  border-radius: 12px;
  width: 320px;
}
.login-box h2 {
  color: #fdfdfd;
  text-align: center;
  margin-bottom: 30px;
}
.login-box input {
  width: 100%;
  height: 45px;
  margin-bottom: 20px;
  padding: 0 15px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}
.login-box button {
  width: 100%;
  height: 45px;
  background: #2196F3;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 17px;
  cursor: pointer;
}
.login-box button:hover {
  background: #1976D2;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>iTEL教程登录</h2>
  <input type="text" id="username" placeholder="请输入账号">
  <input type="password" id="password" placeholder="请输入密码">
  <button onclick="login()">登录</button>
</div>
<img src="logo.jpg" alt="iTel logo" class="logo">

<script>
// 多账号在这里改 格式：账号|密码,账号2|密码2
const userList = "admin@C.com|462009,user1@C.com|123456";

function checkLogin(inputUser, inputPwd){
    let users = userList.split(',');
    for(let item of users){
        let [u,p] = item.split('|');
        if(u === inputUser && p === inputPwd){
            return true;
        }
    }
    return false;
}

// 点击按钮登录
function login(){
    let un = document.getElementById("username").value;
    let pw = document.getElementById("password").value;
    if(checkLogin(un,pw)){
        window.location.href = "home.html";
    }else{
        alert("账号或密码错误");
    }
}

// 按回车键登录
document.getElementById("password").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        login();
    }
});
</script>

</body>
</html>
